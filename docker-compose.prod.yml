services:

  backend:
    build: ./backend
    container_name: finsmart-backend
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: "7"
      DATABASE_URL: sqlite:///./data/finsmart.db
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "python seed_completo.py; uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: finsmart-frontend
    ports:
      - "5016:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
