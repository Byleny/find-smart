services:

  backend:
    build: ./backend
    container_name: finsmart-backend
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: "7"
      DATABASE_URL: sqlite:///./data/finsmart.db
      PYTHONUNBUFFERED: "1"
      DISPLAY: ":99"
      # Correo de notificaciones (invitación a grupo, confirmar pago, alerta de
      # presupuesto), enviado al correo registrado del usuario. Si SMTP_* no
      # está en el .env del servidor, el envío se omite sin romper nada.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-FinSmart}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
    command: ["sh", "start.sh"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: finsmart-frontend
    ports:
      - "5016:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
