services:

  backend:
    build: ./backend
    container_name: finsmart-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app             
    environment:
      SECRET_KEY: finsmart-dev-secret-key-cambiar-en-produccion-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: "7"
      DATABASE_URL: sqlite:///./finsmart.db
      PYTHONUNBUFFERED: "1"
      DISPLAY: ":99"
      # Correo de notificaciones (invitación a grupo, confirmar pago, alerta de
      # presupuesto). Vacío en dev: el envío se omite sin romper nada.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-FinSmart}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    command: ["sh", "start.sh", "--reload"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: finsmart-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app                   
      - frontend_modules:/app/node_modules 
    environment:
      NEXT_PUBLIC_API_URL: /api 
      WATCHPACK_POLLING: "true"          
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_modules:
